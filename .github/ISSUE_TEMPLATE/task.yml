name: Task
description: A concrete piece of work, often a step of a larger feature.
type: Task
projects: ["bunbird/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The work, in two to four lines. Link the parent feature or design it belongs to.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How anyone can tell this is finished.
    validations:
      required: true
