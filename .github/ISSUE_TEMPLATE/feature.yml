name: Feature
description: Something new, or a better way to do something that already exists.
type: Feature
projects: ["bunbird/1"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true once this is done. Written so anyone can check it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, if there is an idea already. Link the RFC or design if there is one.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this deliberately leaves for later.
