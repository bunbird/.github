name: "Tools: Gitleaks"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-gitleaks.yml
