version: 2
updates:
  # A release is not proposed the week it is published: a poisoned release is usually caught within days, so waiting
  # is the cheap supply-chain mitigation. A bump here reaches the other repositories only when they move their pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
